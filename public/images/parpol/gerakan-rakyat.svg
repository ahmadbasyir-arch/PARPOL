<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Siluet Harimau / Macan Merah Melangkah ke Kiri -->
  <g transform="translate(150, 115)">
    <!-- Tubuh, Kepala, Ekor, dan Kaki Macan Merah -->
    <path d="M -80,-5 C -75,-15 -65,-22 -55,-15 C -45,-8 -40,-12 -35,-20 C -25,-15 -15,-10 0,-12 C 25,-15 50,-5 65,-25 C 72,-35 80,-30 75,-15 C 65,10 50,15 45,30 L 40,55 L 28,55 L 30,32 C 15,35 5,32 -5,30 L -8,55 L -20,55 L -18,28 C -30,26 -40,20 -48,25 L -52,55 L -64,55 L -60,20 C -70,18 -80,10 -80,-5 Z" fill="#dc2626"/>
    <!-- Kepala & Telinga Harimau -->
    <circle cx="-62" cy="-14" r="6" fill="#dc2626"/>
    <circle cx="-55" cy="-22" r="4" fill="#dc2626"/>
    <!-- Loreng Harimau Putih -->
    <path d="M -30,-8 L -35,5 M -15,-5 L -20,10 M 5,-7 L 0,8 M 25,-8 L 20,8" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Kotak Tulisan Bawah PARTAI GERAKAN RAKYAT -->
  <rect x="20" y="215" width="260" height="55" rx="6" fill="#b91c1c"/>
  <text x="150" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="3">PARTAI</text>
  <text x="150" y="260" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">GERAKAN RAKYAT</text>
</svg>
