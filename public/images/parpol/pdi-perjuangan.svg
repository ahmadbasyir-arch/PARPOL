<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#dc2626"/>
  <!-- Lingkaran Hitam -->
  <circle cx="150" cy="120" r="85" fill="#09090b" stroke="#ffffff" stroke-width="4"/>
  <!-- Kepala Banteng Hitam Moncong Putih -->
  <g transform="translate(150, 115)">
    <!-- Tanduk Kiri -->
    <path d="M -25,-25 C -55,-60 -75,-65 -80,-50 C -70,-35 -50,-20 -25,-10 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Tanduk Kanan -->
    <path d="M 25,-25 C 55,-60 75,-65 80,-50 C 70,-35 50,-20 25,-10 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Kepala & Dahi Banteng -->
    <path d="M -35,-20 Q 0,-30 35,-20 L 45,15 Q 0,40 -45,15 Z" fill="#09090b"/>
    <!-- Mata Merah -->
    <circle cx="-22" cy="-2" r="5" fill="#ef4444"/>
    <circle cx="22" cy="-2" r="5" fill="#ef4444"/>
    <!-- Moncong Putih Khas -->
    <ellipse cx="0" cy="30" rx="26" ry="18" fill="#ffffff"/>
    <ellipse cx="-10" cy="32" rx="4" ry="6" fill="#09090b"/>
    <ellipse cx="10" cy="32" rx="4" ry="6" fill="#09090b"/>
  </g>
  <!-- Banner Teks Bawah PDI PERJUANGAN -->
  <rect x="20" y="225" width="260" height="52" rx="6" fill="#991b1b" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="248" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDI</text>
  <text x="150" y="268" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="3">PERJUANGAN</text>
</svg>
