<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#1e3a8a"/>
  <!-- Bendera / Pita Biru Muda & Biru Tua -->
  <rect x="0" y="60" width="300" height="110" fill="#0284c7"/>
  <!-- Bintang Segitiga Tiga Sudut (Bintang Mercy) -->
  <g transform="translate(150, 115)">
    <!-- Sudut Atas (Merah) -->
    <polygon points="0,-60 0,0 22,-12" fill="#ef4444"/>
    <polygon points="0,-60 0,0 -22,-12" fill="#dc2626"/>
    <!-- Sudut Kiri Bawah (Putih) -->
    <polygon points="-52,30 0,0 -12,-22" fill="#ffffff"/>
    <polygon points="-52,30 0,0 -12,22" fill="#e2e8f0"/>
    <!-- Sudut Kanan Bawah (Putih) -->
    <polygon points="52,30 0,0 12,-22" fill="#ffffff"/>
    <polygon points="52,30 0,0 12,22" fill="#e2e8f0"/>
  </g>
  <!-- Kotak Tulisan PARTAI DEMOKRAT -->
  <rect x="25" y="225" width="250" height="48" rx="6" fill="#0f172a"/>
  <text x="150" y="255" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="3">PARTAI DEMOKRAT</text>
</svg>
