<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#facc15"/>
  <!-- Perisai Segilima Kuning Emas -->
  <path d="M 150,20 L 255,60 L 225,200 L 150,225 L 75,200 L 45,60 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <!-- Pohon Beringin Rimbun -->
  <g transform="translate(150, 115)">
    <!-- Daun Rimbun Hijau / Hitam -->
    <path d="M -50,0 C -70,-30 -40,-70 0,-70 C 40,-70 70,-30 50,0 C 65,20 40,35 15,25 L 15,40 L -15,40 L -15,25 C -40,35 -65,20 -50,0 Z" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <!-- Batang & Akar Gantung -->
    <path d="M -10,15 L -10,48 L 10,48 L 10,15 Z" fill="#78350f"/>
    <path d="M -25,20 L -25,48 M 25,20 L 25,48 M -40,15 L -35,45 M 40,15 L 35,45" stroke="#78350f" stroke-width="2.5"/>
    <!-- Rerumputan Bawah -->
    <path d="M -55,48 L 55,48" stroke="#15803d" stroke-width="4"/>
  </g>
  <!-- Pita Tulisan GOLONGAN KARYA -->
  <rect x="25" y="240" width="250" height="42" rx="6" fill="#ca8a04" stroke="#854d0e" stroke-width="2"/>
  <text x="150" y="267" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">GOLONGAN KARYA</text>
</svg>
