<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#14532d"/>
  <rect x="8" y="8" width="284" height="284" rx="12" fill="none" stroke="#facc15" stroke-width="3"/>
  <!-- Bulan Sabit Kuning & Bintang Khas PBB -->
  <g transform="translate(150, 115)">
    <!-- Bulan Sabit Terbuka ke Kanan/Atas -->
    <path d="M -15,55 C -55,45 -70,-20 -35,-55 C -45,-30 -35,25 0,38 C 25,48 48,32 55,20 C 45,45 15,62 -15,55 Z" fill="#facc15"/>
    <!-- Bintang Emas Bersebelahan -->
    <polygon points="15,-25 19,-12 32,-12 21,-4 25,9 15,1 5,9 9,-4 -2,-12 11,-12" fill="#facc15"/>
  </g>
  <!-- Kotak Tulisan Bawah PARTAI BULAN BINTANG -->
