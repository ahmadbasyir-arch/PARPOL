<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#0f172a"/>
  <!-- Lingkaran Luar Biru -->
  <circle cx="150" cy="115" r="75" fill="#1e3a8a" stroke="#ffffff" stroke-width="3"/>
  <!-- Spiral / Vortex Khas NasDem (Oranye & Biru) -->
  <g transform="translate(150, 115)">
    <!-- Bulan Sabit / Swirl Oranye -->
    <path d="M -45,10 C -45,-35 0,-55 35,-45 C 5,-40 -15,-20 -20,10 C -25,35 5,45 25,30 C 5,55 -35,45 -45,10 Z" fill="#f97316"/>
    <!-- Swirl Biru Muda / Putih Kontras -->
    <path d="M 40,-10 C 40,30 5,50 -25,40 C 0,35 15,18 18,-10 C 20,-30 -5,-40 -20,-30 C -5,-50 30,-40 40,-10 Z" fill="#60a5fa"/>
  </g>
  <!-- Teks Bawah Partai NasDem -->
  <text x="150" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">Partai NasDem</text>
  <rect x="75" y="255" width="150" height="5" rx="2" fill="#f97316"/>
  <text x="150" y="275" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#93c5fd" text-anchor="middle" letter-spacing="3">GERAKAN PERUBAHAN</text>
</svg>
