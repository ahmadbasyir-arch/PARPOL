<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#0284c7"/>
  <!-- Lingkaran Putih -->
  <circle cx="150" cy="115" r="75" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <!-- Gelombang Ombak Gelora (Merah & Biru Tua) -->
  <g transform="translate(150, 115)">
    <!-- Gelombang Merah Melengkung Atas -->
    <path d="M -50,-5 C -45,-45 25,-55 50,-15 C 40,-25 15,-32 -5,-25 C -25,-18 -38,-5 -40,15 C -46,8 -48,0 -50,-5 Z" fill="#ef4444"/>
    <!-- Gelombang Biru Bawah Melingkar -->
    <path d="M 45,5 C 40,45 -25,50 -45,18 C -25,25 0,22 15,10 C 30,-2 28,-18 15,-28 C 30,-20 42,-8 45,5 Z" fill="#0284c7"/>
  </g>
  <!-- Teks Bawah GELORA INDONESIA -->
  <rect x="25" y="215" width="250" height="60" rx="8" fill="#ffffff"/>
  <text x="150" y="248" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#0284c7" text-anchor="middle" letter-spacing="2">GELORA</text>
  <text x="150" y="266" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ef4444" text-anchor="middle" letter-spacing="4">INDONESIA</text>
</svg>
