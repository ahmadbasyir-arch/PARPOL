  <text x="150" y="268" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#1e3a8a" text-anchor="middle" letter-spacing="2">PARTAI AMANAT NASIONAL</text>
