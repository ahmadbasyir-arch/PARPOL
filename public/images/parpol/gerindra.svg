<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="150" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#b91c1c" text-anchor="middle" letter-spacing="3">PARTAI</text>
  <!-- Perisai / Bingkai Segilima -->
  <path d="M 150,45 L 240,75 L 225,185 L 150,225 L 75,185 L 60,75 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="3"/>
  <path d="M 150,55 L 228,82 L 215,178 L 150,212 L 85,178 L 72,82 Z" fill="#ffffff"/>
  <!-- Kepala Garuda Emas -->
  <g transform="translate(150, 130)">
    <!-- Siluet Garuda -->
    <path d="M -35,-40 C -10,-45 20,-30 35,-15 C 25,-10 15,-12 5,-8 C 25,5 45,15 35,35 C 20,30 10,25 -5,22 C -8,28 -5,35 -2,42 C -15,38 -25,30 -30,20 C -25,15 -18,18 -15,12 C -28,8 -38,-5 -35,-40 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <!-- Paruh Garuda -->
    <path d="M 10,-8 C 30,-5 42,5 45,18 C 35,16 25,10 10,6 Z" fill="#facc15" stroke="#a16207" stroke-width="1.5"/>
    <!-- Mata -->
    <circle cx="5" cy="-18" r="4" fill="#1e293b"/>
    <circle cx="6" cy="-19" r="1.5" fill="#ffffff"/>
    <!-- Bulu Leher Bertingkat -->
    <path d="M -25,0 L -5,5 L -20,12 L -2,16 L -18,24" stroke="#ca8a04" stroke-width="2" fill="none"/>
  </g>
  <!-- Banner Bawah GERINDRA -->
  <rect x="25" y="240" width="250" height="42" rx="6" fill="#b91c1c"/>
  <text x="150" y="268" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">GERINDRA</text>
</svg>
