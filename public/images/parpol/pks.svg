<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#f97316"/>
  <!-- Lingkaran Putih Pusat -->
  <circle cx="150" cy="110" r="75" fill="#ea580c" stroke="#ffffff" stroke-width="3"/>
  <!-- Bulan Sabit Kembar & Untaian Padi -->
  <g transform="translate(150, 110)">
    <!-- Bulan Sabit Kiri Putih -->
    <path d="M -20,-45 C -45,-30 -50,20 -20,45 C -35,30 -35,-20 -20,-45 Z" fill="#ffffff"/>
    <!-- Bulan Sabit Kanan Putih -->
    <path d="M 20,-45 C 45,-30 50,20 20,45 C 35,30 35,-20 20,-45 Z" fill="#ffffff"/>
    <!-- Tangkai Padi Tengah Vertikal -->
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="-6" cy="-30" rx="4" ry="7" fill="#ffffff" transform="rotate(-30, -6, -30)"/>
    <ellipse cx="6" cy="-30" rx="4" ry="7" fill="#ffffff" transform="rotate(30, 6, -30)"/>
    <ellipse cx="-7" cy="-10" rx="4" ry="7" fill="#ffffff" transform="rotate(-30, -7, -10)"/>
    <ellipse cx="7" cy="-10" rx="4" ry="7" fill="#ffffff" transform="rotate(30, 7, -10)"/>
    <ellipse cx="-7" cy="10" rx="4" ry="7" fill="#ffffff" transform="rotate(-30, -7, 10)"/>
    <ellipse cx="7" cy="10" rx="4" ry="7" fill="#ffffff" transform="rotate(30, 7, 10)"/>
    <ellipse cx="-6" cy="30" rx="4" ry="7" fill="#ffffff" transform="rotate(-30, -6, 30)"/>
    <ellipse cx="6" cy="30" rx="4" ry="7" fill="#ffffff" transform="rotate(30, 6, 30)"/>
  </g>
  <!-- Kotak Putih Bawah PKS -->
  <rect x="25" y="215" width="250" height="60" rx="8" fill="#ffffff"/>
  <text x="150" y="260" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="42" fill="#0f172a" text-anchor="middle" letter-spacing="4">PKS</text>
</svg>
