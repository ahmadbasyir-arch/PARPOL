<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" width="100%" height="100%">
  <defs>
    <style>
      .class-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .class-text { font-family: "Consolas", "Courier New", monospace; font-size: 11px; fill: #1e293b; }
      .class-comment { font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-style: italic; fill: #64748b; }
      .assoc-line { stroke: #334155; stroke-width: 1.6; fill: none; }
      .multiplicity { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .caption { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-style: italic; fill: #64748b; text-anchor: middle; }
    </style>
    <!-- Arrow marker for Generalization/Inheritance (Hollow Triangle) -->
    <marker id="inheritance" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <polygon points="1,2 13,7 1,12" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="780" fill="#ffffff" />

  <!-- ================= RELATIONSHIP LINES ================= -->

  <!-- 1. Parpol (left) to Pendidikan_Politik (left-bottom) -->
  <line x1="190" y1="510" x2="190" y2="560" class="assoc-line" />
  <text x="200" y="525" class="multiplicity">1</text>
  <text x="200" y="552" class="multiplicity">0..*</text>

  <!-- 2. Petugas_Bakesbangpol (center-top) to Parpol (left) -->
  <path d="M 420 120 L 340 120 L 340 180" class="assoc-line" />
  <text x="405" y="112" class="multiplicity">1</text>
  <text x="350" y="175" class="multiplicity">1..*</text>

  <!-- 3. Petugas_Bakesbangpol (center-top) to Aspirasi (center) -->
  <line x1="545" y1="200" x2="545" y2="240" class="assoc-line" />
  <text x="555" y="215" class="multiplicity">1</text>
  <text x="555" y="235" class="multiplicity">0..*</text>

  <!-- 4. Parpol (left) to Aspirasi (center) -->
  <line x1="340" y1="355" x2="420" y2="355" class="assoc-line" />
  <text x="348" y="348" class="multiplicity">1</text>
  <text x="405" y="348" class="multiplicity">0..*</text>

  <!-- 5. Inheritance: Pengkinian_Data_LO (right-top) -> Aspirasi (center) -->
  <!-- Target Aspirasi right edge at (670, 310) -->
  <path d="M 740 165 L 705 165 L 705 310 L 670 310" class="assoc-line" marker-end="url(#inheritance)" />

  <!-- 6. Inheritance: Aspirasi_Masyarakat (right-bottom) -> Aspirasi (center) -->
  <!-- Target Aspirasi right edge at (670, 390) -->
  <path d="M 740 520 L 705 520 L 705 390 L 670 390" class="assoc-line" marker-end="url(#inheritance)" />


  <!-- ================= CLASS 1: Parpol ================= -->
  <g id="class-parpol">
    <!-- Box Outer -->
    <rect x="50" y="140" width="290" height="370" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="50" y="140" width="290" height="35" fill="#14b8a6" stroke="#334155" stroke-width="1.5" />
    <text x="195" y="163" class="class-title">Parpol</text>

    <!-- Attributes -->
    <text x="62" y="193" class="class-text">+ id: int</text>
    <text x="62" y="209" class="class-text">+ nomor_urut: int</text>
    <text x="62" y="225" class="class-text">+ nama_partai: string</text>
    <text x="62" y="241" class="class-text">+ akronim: string</text>
    <text x="62" y="257" class="class-text">+ logo: string</text>
    <text x="62" y="273" class="class-text">+ no_sk: string</text>
    <text x="62" y="289" class="class-text">+ tanggal_sk: string</text>
    <text x="62" y="305" class="class-text">+ ketua: string</text>
    <text x="62" y="321" class="class-text">+ sekretaris: string</text>
    <text x="62" y="337" class="class-text">+ bendahara: string</text>
    <text x="62" y="353" class="class-text">+ lo_nama: string</text>
    <text x="62" y="369" class="class-text">+ lo_hp: string</text>
    <text x="62" y="385" class="class-text">+ alamat: text</text>
    <text x="62" y="401" class="class-text">+ kecamatan: string</text>
    <text x="62" y="417" class="class-text">+ sk3p3: string</text>

    <!-- Divider Line -->
    <line x1="50" y1="428" x2="340" y2="428" stroke="#334155" stroke-width="1" />

    <!-- Operations -->
    <text x="62" y="446" class="class-text">+ get_semua_parpol()</text>
    <text x="62" y="462" class="class-text">+ cari_parpol(keyword, kec)</text>
    <text x="62" y="478" class="class-text">+ filter_wilayah(kecamatan)</text>
    <text x="62" y="494" class="class-text">+ get_detail_sk()</text>
  </g>


  <!-- ================= CLASS 2: Pendidikan_Politik ================= -->
  <g id="class-pendidikan-politik">
    <!-- Box Outer -->
    <rect x="50" y="560" width="290" height="185" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="50" y="560" width="290" height="35" fill="#14b8a6" stroke="#334155" stroke-width="1.5" />
    <text x="195" y="583" class="class-title">Pendidikan_Politik</text>

    <!-- Attributes -->
    <text x="62" y="612" class="class-text">+ id: int</text>
    <text x="62" y="628" class="class-text">+ parpol_id: int</text>
    <text x="62" y="644" class="class-text">+ nama_kegiatan: string</text>
    <text x="62" y="660" class="class-text">+ tanggal_pelaksanaan: string</text>
    <text x="62" y="676" class="class-text">+ peserta_jumlah: int</text>
    <text x="62" y="692" class="class-text">+ jumlah_biaya: bigint</text>
    <text x="62" y="708" class="class-text">+ dokumentasi: string</text>

    <!-- Divider Line -->
    <line x1="50" y1="718" x2="340" y2="718" stroke="#334155" stroke-width="1" />

    <!-- Operations -->
    <text x="62" y="733" class="class-text">+ tambah_kegiatan()</text>
    <text x="62" y="747" class="class-text">+ get_realisasi_anggaran()</text>
  </g>


  <!-- ================= CLASS 3: Petugas_Bakesbangpol ================= -->
  <g id="class-petugas">
    <!-- Box Outer -->
    <rect x="420" y="40" width="250" height="160" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="420" y="40" width="250" height="35" fill="#14b8a6" stroke="#334155" stroke-width="1.5" />
    <text x="545" y="63" class="class-title">Petugas_Bakesbangpol</text>

    <!-- Attributes -->
    <text x="432" y="93" class="class-text">+ id_petugas: int</text>
    <text x="432" y="109" class="class-text">+ nama: string</text>
    <text x="432" y="125" class="class-text">+ email: string</text>
    <text x="432" y="141" class="class-text">+ jabatan: string</text>

    <!-- Divider Line -->
    <line x1="420" y1="152" x2="670" y2="152" stroke="#334155" stroke-width="1" />

    <!-- Operations -->
    <text x="432" y="170" class="class-text">+ verifikasi_berkas_sk()</text>
    <text x="432" y="186" class="class-text">+ cetak_rekapitulasi_a4()</text>
  </g>


  <!-- ================= CLASS 4: Aspirasi (Kelas Induk) ================= -->
  <g id="class-aspirasi">
    <!-- Box Outer -->
    <rect x="420" y="240" width="250" height="235" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="420" y="240" width="250" height="35" fill="#14b8a6" stroke="#334155" stroke-width="1.5" />
    <text x="545" y="263" class="class-title">Aspirasi</text>

    <!-- Attributes -->
    <text x="432" y="293" class="class-text">+ id: int</text>
    <text x="432" y="309" class="class-text">+ nama: string</text>
    <text x="432" y="325" class="class-text">+ email: string</text>
    <text x="432" y="341" class="class-text">+ kategori: string</text>
    <text x="432" y="357" class="class-text">+ subjek: string</text>
    <text x="432" y="373" class="class-text">+ pesan: text</text>
    <text x="432" y="389" class="class-text">+ status: string</text>

    <!-- Divider Line -->
    <line x1="420" y1="400" x2="670" y2="400" stroke="#334155" stroke-width="1" />

    <!-- Operations -->
    <text x="432" y="418" class="class-text">+ simpan_pesan()</text>
    <text x="432" y="434" class="class-text">+ verifikasi_pesan()</text>
    <text x="432" y="450" class="class-text">+ ubah_status()</text>
    <text x="432" y="466" class="class-text">+ get_riwayat_pesan()</text>
  </g>


  <!-- ================= CLASS 5: Pengkinian_Data_LO (Spesialisasi / Turunan) ================= -->
  <g id="class-pengkinian">
    <!-- Box Outer -->
    <rect x="740" y="60" width="270" height="210" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="740" y="60" width="270" height="35" fill="#14b8a6" stroke="#334155" stroke-width="1.5" />
    <text x="875" y="83" class="class-title">Pengkinian_Data_LO</text>

    <!-- Attributes -->
    <text x="752" y="113" class="class-text">+ nama_partai: string</text>
    <text x="752" y="129" class="class-text">+ nama_pemohon: string</text>
    <text x="752" y="145" class="class-text">+ jabatan: string</text>
    <text x="752" y="161" class="class-text">+ no_hp: string</text>
    <text x="752" y="177" class="class-text">+ rincian_perubahan: text</text>

    <!-- Divider Line -->
    <line x1="740" y1="188" x2="1010" y2="188" stroke="#334155" stroke-width="1" />

    <!-- Operations -->
    <text x="752" y="206" class="class-text">+ ajukan_perubahan_sk()</text>
    <text x="752" y="222" class="class-text">+ konfirmasi_kontak_lo()</text>
    <text x="752" y="238" class="class-text">+ lampirkan_sk_baru()</text>
    <text x="752" y="254" class="class-text">+ pantau_verifikasi()</text>
  </g>


  <!-- ================= CLASS 6: Aspirasi_Masyarakat (Spesialisasi / Turunan) ================= -->
  <g id="class-aspirasi-publik">
    <!-- Box Outer -->
    <rect x="740" y="420" width="270" height="200" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="740" y="420" width="270" height="35" fill="#14b8a6" stroke="#334155" stroke-width="1.5" />
    <text x="875" y="443" class="class-title">Aspirasi_Masyarakat</text>

    <!-- Attributes -->
    <text x="752" y="473" class="class-text">+ kategori_pesan: string</text>
    <text x="752" y="489" class="class-text">+ topik_aspirasi: string</text>
    <text x="752" y="505" class="class-text">+ tanggapan_admin: text</text>

    <!-- Divider Line -->
    <line x1="740" y1="518" x2="1010" y2="518" stroke="#334155" stroke-width="1" />

    <!-- Operations -->
    <text x="752" y="536" class="class-text">+ kirim_saran_publik()</text>
    <text x="752" y="552" class="class-text">+ cek_status_tanggapan()</text>
    <text x="752" y="568" class="class-text">+ filter_kategori_pesan()</text>
  </g>

  <!-- Caption -->
  <text x="530" y="765" class="caption">Class Diagram Sistem Informasi Partai Politik (SIPARPOL) Kabupaten Tanah Laut</text>
</svg>