<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 910" width="100%" height="100%">
  <defs>
    <style>
      .class-hdr { font-family: "Segoe UI", Arial, sans-serif; font-size: 16.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .class-body { font-family: "Segoe UI", Arial, sans-serif; font-size: 14.5px; font-weight: 500; fill: #0f172a; }
      .class-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .hdr-rect { fill: #22c0c3; stroke: #94a3b8; stroke-width: 1.5; }
      .div-line { stroke: #e2e8f0; stroke-width: 1.2; }
      .conn-line { stroke: #1e293b; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#1e293b" />
    </marker>
  </defs>

  <rect width="980" height="910" fill="#ffffff" />

  <!-- Connection Lines -->
  <line x1="172" y1="245" x2="172" y2="285" class="conn-line" />
  <line x1="172" y1="595" x2="172" y2="635" class="conn-line" />
  <line x1="310" y1="440" x2="352" y2="440" class="conn-line" />
  <line x1="670" y1="260" x2="632" y2="325" class="conn-line" marker-end="url(#arrow)" />
  <line x1="670" y1="655" x2="632" y2="555" class="conn-line" marker-end="url(#arrow)" />

  <!-- 1. Pengurus_lo -->
  <g id="box-pengurus-lo">
    <rect x="35" y="30" width="275" height="215" class="class-box" />
    <rect x="35" y="30" width="275" height="46" class="hdr-rect" />
    <text x="172" y="53" class="class-hdr">Pengurus_lo</text>
    <text x="53" y="102" class="class-body">+ id_lo: int</text>
    <text x="53" y="127" class="class-body">+ nama: char</text>
    <text x="53" y="152" class="class-body">+ no_hp: char</text>
    <line x1="35" y1="166" x2="310" y2="166" class="div-line" />
    <text x="53" y="192" class="class-body">+ insert_data ()</text>
    <text x="53" y="217" class="class-body">+ update_data ()</text>
  </g>

  <!-- 2. Parpol -->
  <g id="box-parpol">
    <rect x="35" y="285" width="275" height="310" class="class-box" />
    <rect x="35" y="285" width="275" height="46" class="hdr-rect" />
    <text x="172" y="308" class="class-hdr">Parpol</text>
    <text x="53" y="357" class="class-body">+ id_parpol: int</text>
    <text x="53" y="382" class="class-body">+ nama_partai: char</text>
    <text x="53" y="407" class="class-body">+ akronim: char</text>
    <text x="53" y="432" class="class-body">+ ketua: char</text>
    <text x="53" y="457" class="class-body">+ sk3p3: char</text>
    <line x1="35" y1="471" x2="310" y2="471" class="div-line" />
    <text x="53" y="497" class="class-body">+ insert_data ()</text>
    <text x="53" y="522" class="class-body">+ update_data ()</text>
    <text x="53" y="547" class="class-body">+ cari_data ()</text>
  </g>

  <!-- 3. Petugas_bakesbangpol -->
  <g id="box-petugas">
    <rect x="35" y="635" width="275" height="255" class="class-box" />
    <rect x="35" y="635" width="275" height="46" class="hdr-rect" />
    <text x="172" y="658" class="class-hdr">Petugas_bakesbangpol</text>
    <text x="53" y="707" class="class-body">+ id_petugas: int</text>
    <text x="53" y="732" class="class-body">+ nama: char</text>
    <text x="53" y="757" class="class-body">+ email: char</text>
    <text x="53" y="782" class="class-body">+ jabatan: char</text>
    <line x1="35" y1="796" x2="310" y2="796" class="div-line" />
    <text x="53" y="822" class="class-body">+ insert_data ()</text>
    <text x="53" y="847" class="class-body">+ update_data ()</text>
    <text x="53" y="872" class="class-body">+ verifikasi_sk ()</text>
  </g>

  <!-- 4. Aspirasi (Center) -->
  <g id="box-aspirasi">
    <rect x="352" y="285" width="275" height="310" class="class-box" />
    <rect x="352" y="285" width="275" height="46" class="hdr-rect" />
    <text x="489" y="308" class="class-hdr">Aspirasi</text>
    <text x="370" y="357" class="class-body">+ id_aspirasi: int</text>
    <text x="370" y="382" class="class-body">+ id_parpol: int</text>
    <text x="370" y="407" class="class-body">+ nama_pengirim: char</text>
    <text x="370" y="432" class="class-body">+ email: char</text>
    <text x="370" y="457" class="class-body">+ status: char</text>
    <line x1="352" y1="471" x2="627" y2="471" class="div-line" />
    <text x="370" y="497" class="class-body">+ insert_data ()</text>
    <text x="370" y="522" class="class-body">+ update_data ()</text>
    <text x="370" y="547" class="class-body">+ verifikasi_pesan ()</text>
  </g>

  <!-- 5. Pengkinian_data_lo -->
  <g id="box-pengkinian">
    <rect x="670" y="30" width="275" height="240" class="class-box" />
    <rect x="670" y="30" width="275" height="46" class="hdr-rect" />
    <text x="807" y="53" class="class-hdr">Pengkinian_data_lo</text>
    <text x="688" y="102" class="class-body">+ id_aspirasi: int</text>
    <text x="688" y="127" class="class-body">+ nama_partai: char</text>
    <text x="688" y="152" class="class-body">+ no_hp: char</text>
    <text x="688" y="177" class="class-body">+ rincian_sk: char</text>
    <line x1="670" y1="191" x2="945" y2="191" class="div-line" />
    <text x="688" y="217" class="class-body">+ insert_data ()</text>
    <text x="688" y="242" class="class-body">+ update_data ()</text>
  </g>

  <!-- 6. Aspirasi_masyarakat -->
  <g id="box-aspirasi-masyarakat">
    <rect x="670" y="635" width="275" height="245" class="class-box" />
    <rect x="670" y="635" width="275" height="46" class="hdr-rect" />
    <text x="807" y="658" class="class-hdr">Aspirasi_masyarakat</text>
    <text x="688" y="707" class="class-body">+ id_aspirasi: int</text>
    <text x="688" y="732" class="class-body">+ kategori: char</text>
    <text x="688" y="757" class="class-body">+ subjek: char</text>
    <text x="688" y="782" class="class-body">+ pesan: char</text>
    <line x1="670" y1="796" x2="945" y2="796" class="div-line" />
    <text x="688" y="822" class="class-body">+ insert_data ()</text>
    <text x="688" y="847" class="class-body">+ update_data ()</text>
  </g>
</svg>