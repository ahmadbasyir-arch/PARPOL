<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="100%" height="100%">
  <defs>
    <style>
      .class-hdr { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .class-body { font-family: "Consolas", "Courier New", monospace; font-size: 11.5px; fill: #18181b; }
      .class-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .hdr-rect { fill: #22c0c3; stroke: #94a3b8; stroke-width: 1.2; }
      .div-line { stroke: #cbd5e1; stroke-width: 1; }
      .conn-line { stroke: #1e293b; stroke-width: 1.5; fill: none; }
      .caption { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-style: italic; fill: #64748b; text-anchor: middle; }
    </style>
    <!-- Arrowhead Marker (Standard UML) -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="640" fill="#ffffff" />

  <!-- ================= CONNECTION LINES ================= -->

  <!-- 1. Vertical line: Pengurus_lo (165, 175) to Parpol (165, 215) -->
  <line x1="165" y1="175" x2="165" y2="215" class="conn-line" />

  <!-- 2. Vertical line: Parpol (165, 395) to Petugas_bakesbangpol (165, 435) -->
  <line x1="165" y1="395" x2="165" y2="435" class="conn-line" />

  <!-- 3. Horizontal line: Parpol (270, 305) to Aspirasi (365, 305) -->
  <line x1="270" y1="305" x2="365" y2="305" class="conn-line" />

  <!-- 4. Diagonal arrow: Pengkinian_data_lo (670, 185) to Aspirasi (575, 235) -->
  <line x1="670" y1="185" x2="578" y2="233" class="conn-line" marker-end="url(#arrow)" />

  <!-- 5. Diagonal arrow: Aspirasi_masyarakat (670, 425) to Aspirasi (575, 375) -->
  <line x1="670" y1="425" x2="578" y2="377" class="conn-line" marker-end="url(#arrow)" />


  <!-- ================= 1. Pengurus_lo (Top Left) ================= -->
  <g id="box-pengurus-lo">
    <rect x="60" y="35" width="210" height="140" class="class-box" />
    <rect x="60" y="35" width="210" height="34" class="hdr-rect" />
    <text x="165" y="52" class="class-hdr">Pengurus_lo</text>

    <!-- Attributes -->
    <text x="72" y="86" class="class-body">+ id_lo: int</text>
    <text x="72" y="102" class="class-body">+ nama: char</text>
    <text x="72" y="118" class="class-body">+ no_hp: char</text>

    <!-- Divider -->
    <line x1="60" y1="128" x2="270" y2="128" class="div-line" />

    <!-- Methods -->
    <text x="72" y="146" class="class-body">+ insert_data ()</text>
    <text x="72" y="162" class="class-body">+ update_data ()</text>
  </g>


  <!-- ================= 2. Parpol (Middle Left) ================= -->
  <g id="box-parpol">
    <rect x="60" y="215" width="210" height="180" class="class-box" />
    <rect x="60" y="215" width="210" height="34" class="hdr-rect" />
    <text x="165" y="232" class="class-hdr">Parpol</text>

    <!-- Attributes -->
    <text x="72" y="266" class="class-body">+ id_parpol: int</text>
    <text x="72" y="282" class="class-body">+ nama_partai: char</text>
    <text x="72" y="298" class="class-body">+ akronim: char</text>
    <text x="72" y="314" class="class-body">+ ketua: char</text>
    <text x="72" y="330" class="class-body">+ sk3p3: char</text>

    <!-- Divider -->
    <line x1="60" y1="340" x2="270" y2="340" class="div-line" />

    <!-- Methods -->
    <text x="72" y="358" class="class-body">+ insert_data ()</text>
    <text x="72" y="374" class="class-body">+ update_data ()</text>
    <text x="72" y="390" class="class-body">+ cari_data ()</text>
  </g>


  <!-- ================= 3. Petugas_bakesbangpol (Bottom Left) ================= -->
  <g id="box-petugas">
    <rect x="60" y="435" width="210" height="150" class="class-box" />
    <rect x="60" y="435" width="210" height="34" class="hdr-rect" />
    <text x="165" y="452" class="class-hdr">Petugas_bakesbangpol</text>

    <!-- Attributes -->
    <text x="72" y="486" class="class-body">+ id_petugas: int</text>
    <text x="72" y="502" class="class-body">+ nama: char</text>
    <text x="72" y="518" class="class-body">+ jabatan: char</text>

    <!-- Divider -->
    <line x1="60" y1="528" x2="270" y2="528" class="div-line" />

    <!-- Methods -->
    <text x="72" y="546" class="class-body">+ insert_data ()</text>
    <text x="72" y="562" class="class-body">+ update_data ()</text>
    <text x="72" y="578" class="class-body">+ verifikasi_sk ()</text>
  </g>


  <!-- ================= 4. Aspirasi (Center Middle) ================= -->
  <g id="box-aspirasi">
    <rect x="365" y="215" width="210" height="180" class="class-box" />
    <rect x="365" y="215" width="210" height="34" class="hdr-rect" />
    <text x="470" y="232" class="class-hdr">Aspirasi</text>

    <!-- Attributes -->
    <text x="377" y="266" class="class-body">+ id_aspirasi: int</text>
    <text x="377" y="282" class="class-body">+ id_parpol: int</text>
    <text x="377" y="298" class="class-body">+ nama_pengirim: char</text>
    <text x="377" y="314" class="class-body">+ email: char</text>
    <text x="377" y="330" class="class-body">+ status: char</text>

    <!-- Divider -->
    <line x1="365" y1="340" x2="575" y2="340" class="div-line" />

    <!-- Methods -->
    <text x="377" y="358" class="class-body">+ insert_data ()</text>
    <text x="377" y="374" class="class-body">+ update_data ()</text>
    <text x="377" y="390" class="class-body">+ verifikasi_pesan ()</text>
  </g>


  <!-- ================= 5. Pengkinian_data_lo (Top Right) ================= -->
  <g id="box-pengkinian">
    <rect x="670" y="35" width="210" height="160" class="class-box" />
    <rect x="670" y="35" width="210" height="34" class="hdr-rect" />
    <text x="775" y="52" class="class-hdr">Pengkinian_data_lo</text>

    <!-- Attributes -->
    <text x="682" y="86" class="class-body">+ id_aspirasi: int</text>
    <text x="682" y="102" class="class-body">+ nama_partai: char</text>
    <text x="682" y="118" class="class-body">+ no_hp: char</text>
    <text x="682" y="134" class="class-body">+ rincian_sk: char</text>

    <!-- Divider -->
    <line x1="670" y1="144" x2="880" y2="144" class="div-line" />

    <!-- Methods -->
    <text x="682" y="162" class="class-body">+ insert_data ()</text>
    <text x="682" y="178" class="class-body">+ update_data ()</text>
  </g>


  <!-- ================= 6. Aspirasi_masyarakat (Bottom Right) ================= -->
  <g id="box-aspirasi-masyarakat">
    <rect x="670" y="425" width="210" height="160" class="class-box" />
    <rect x="670" y="425" width="210" height="34" class="hdr-rect" />
    <text x="775" y="442" class="class-hdr">Aspirasi_masyarakat</text>

    <!-- Attributes -->
    <text x="682" y="476" class="class-body">+ id_aspirasi: int</text>
    <text x="682" y="492" class="class-body">+ kategori: char</text>
    <text x="682" y="508" class="class-body">+ subjek: char</text>
    <text x="682" y="524" class="class-body">+ pesan: char</text>

    <!-- Divider -->
    <line x1="670" y1="534" x2="880" y2="534" class="div-line" />

    <!-- Methods -->
    <text x="682" y="552" class="class-body">+ insert_data ()</text>
    <text x="682" y="568" class="class-body">+ update_data ()</text>
  </g>

  <!-- Caption -->
  <text x="470" y="622" class="caption">Class Diagram Sistem Informasi Partai Politik (SIPARPOL) Kabupaten Tanah Laut</text>
</svg>
