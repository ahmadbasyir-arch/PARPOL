<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="flagWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="overlayGrad5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.9)" />
      <stop offset="55%" stop-color="rgba(15, 23, 42, 0.3)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad5)" />

  <!-- Big Flag Flowing -->
  <path d="M0,80 Q200,30 400,90 T800,60 L800,220 Q600,260 400,200 T0,240 Z" fill="#ef4444" opacity="0.9" />
  <path d="M0,240 Q200,200 400,260 T800,220 L800,380 Q600,420 400,360 T0,400 Z" fill="url(#flagWhite)" opacity="0.95" />

  <!-- Center Flag Icon -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="62" fill="#ffffff" />
    <circle cx="0" cy="0" r="54" fill="#b91c1c" />
    <!-- Flagpole & Flag -->
    <rect x="-18" y="-30" width="4" height="60" fill="#facc15" />
    <path d="M-14,-28 L18,-28 L18,-8 L-14,-8 Z" fill="#ef4444" />
    <path d="M-14,-8 L18,-8 L18,12 L-14,12 Z" fill="#ffffff" />
  </g>

  <rect width="800" height="500" fill="url(#overlayGrad5)" />

  <rect x="40" y="40" width="240" height="34" rx="17" fill="#f87171" />
  <text x="160" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#450a0a" text-anchor="middle" letter-spacing="1">AKSI MERAH PUTIH</text>

  <text x="40" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Aksi Lapangan Pembagian 10 Juta Bendera Merah Putih</text>
  <text x="40" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="500" fill="#fecaca">Lokasi: Simpang Bundaran Angsau &amp; Pasar Rakyat Pelaihari</text>
  <text x="40" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">1.000+ Bendera Dibagikan ke Warga &amp; Pengendara</text>
</svg>
