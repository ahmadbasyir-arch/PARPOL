<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.2)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)" />

  <!-- Geometric & Flag Elements -->
  <path d="M0,0 L800,0 L800,160 L0,240 Z" fill="#b91c1c" opacity="0.6" />
  <path d="M0,240 L800,160 L800,320 L0,400 Z" fill="#ffffff" opacity="0.1" />

  <!-- Decorative circles -->
  <circle cx="700" cy="120" r="140" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.25" />
  <circle cx="700" cy="120" r="180" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8 8" opacity="0.2" />

  <!-- Emblem / Icon Center -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="68" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="0" cy="0" r="60" fill="#ffffff" />
    <!-- Garuda / Shield icon -->
    <path d="M-28,-20 C-10,-28 10,-28 28,-20 C28,15 15,35 0,46 C-15,35 -28,15 -28,-20 Z" fill="#b91c1c" />
    <path d="M-18,-10 C-6,-15 6,-15 18,-10 C18,12 10,25 0,33 C-10,25 -18,12 -18,-10 Z" fill="#fbbf24" />
    <!-- Star -->
    <polygon points="0,-6 2.5,0 9,0 3.7,4 5.5,10 0,6.5 -5.5,10 -3.7,4 -9,0 -2.5,0" fill="#ffffff" />
  </g>

  <!-- Overlay for text legibility -->
  <rect width="800" height="500" fill="url(#overlayGrad)" />

  <!-- Badge -->
  <rect x="40" y="40" width="220" height="34" rx="17" fill="#fbbf24" />
  <text x="150" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle" letter-spacing="1">DOKUMENTASI LAPANGAN</text>

  <!-- Title & Metadata -->
  <text x="40" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Sosialisasi Penguatan 4 Konsensus Kebangsaan</text>
  <text x="40" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="500" fill="#fcd34d">Lokasi: SMKN 1 Pelaihari • Peserta: 250 Siswa OSIS</text>
  <text x="40" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Badan Kesbangpol Kab. Tanah Laut • Bidang Bina Ideologi &amp; Wasbang</text>

  <!-- Official Stamp watermark -->
  <g transform="translate(710, 420) rotate(-12)">
    <rect x="-65" y="-18" width="130" height="36" rx="6" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.9"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#22c55e" text-anchor="middle" letter-spacing="1.5">TERARSIP RESMI</text>
  </g>
</svg>
