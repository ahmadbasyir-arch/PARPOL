<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="overlayGrad6" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.9)" />
      <stop offset="55%" stop-color="rgba(15, 23, 42, 0.3)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad6)" />

  <!-- Traditional cultural & banner motifs -->
  <polygon points="50,100 750,100 400,260" fill="#ea580c" opacity="0.15" />
  <circle cx="400" cy="200" r="140" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Icon Center -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="62" fill="url(#goldGrad6)" />
    <circle cx="0" cy="0" r="54" fill="#7c2d12" />
    <!-- Shield & Book/Torch -->
    <path d="M-15,-20 L15,-20 L10,18 L0,26 L-10,18 Z" fill="#fde047" />
    <polygon points="0,-16 4,-6 14,-6 6,0 9,10 0,4 -9,10 -6,0 -14,-6 -4,-6" fill="#7c2d12" />
  </g>

  <rect width="800" height="500" fill="url(#overlayGrad6)" />

  <rect x="40" y="40" width="220" height="34" rx="17" fill="#fb923c" />
  <text x="150" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#431407" text-anchor="middle" letter-spacing="1">BINA KARAKTER</text>

  <text x="40" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Roadshow Lapangan Ketahanan Budaya &amp; Moralitas</text>
  <text x="40" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="500" fill="#fdba74">Lokasi: Lapangan Terbuka Kantor Camat Tambang Ulang</text>
  <text x="40" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">90 Tokoh Pemuda &amp; Warga • Komitmen Bersama Anti Radikalisme</text>
</svg>
