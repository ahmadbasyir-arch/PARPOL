<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>
  <!-- Outer double ring -->
  <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="url(#ringGrad)" stroke-width="4" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <!-- Center Shield (Indonesian / Kesbangpol Identity) -->
  <path d="M50,22 C64,26 68,30 68,44 C68,58 50,70 50,70 C50,70 32,58 32,44 C32,30 36,26 50,22 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <path d="M50,24 C62,27.5 66,31 66,44 L34,44 C34,31 38,27.5 50,24 Z" fill="url(#shieldRed)" />
  <path d="M34,44 L66,44 C66,56 50,67 50,67 C50,67 34,56 34,44 Z" fill="#f8fafc" />
  <!-- Golden Star -->
  <circle cx="50" cy="44" r="7" fill="#f59e0b" />
  <polygon points="50,39 51.2,42.5 55,42.5 52,44.5 53.2,48 50,45.8 46.8,48 48,44.5 45,42.5 48.8,42.5" fill="#ffffff" />
  <!-- Rice & Cotton ring motif -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
</svg>
