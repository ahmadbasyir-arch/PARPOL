<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Lingkaran Bingkai -->
  <circle cx="250" cy="250" r="235" fill="url(#circleGrad)" stroke="url(#goldGrad)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Perisai Merah Putih -->
  <path d="M 250,75 L 370,120 C 370,270 250,370 250,370 C 250,370 130,270 130,120 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Bagian Bawah Putih Perisai -->
  <path d="M 250,190 L 350,190 C 345,265 250,345 250,345 C 250,345 155,265 150,190 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Obor / Bintang Kejayaan Emas -->
  <g transform="translate(250, 150)">
    <!-- Bintang Emas -->
    <polygon points="0,-45 13,-14 45,-14 20,6 30,38 0,18 -30,38 -20,6 -45,-14 -13,-14" fill="url(#goldGrad)" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- Padi dan Kapas (Simbol Kemakmuran) -->
  <g stroke="url(#goldGrad)" stroke-width="3" fill="none">
    <!-- Tangkai Kiri Padi -->
    <path d="M 170,290 C 150,250 160,180 185,150" stroke-linecap="round"/>
    <circle cx="160" cy="250" r="6" fill="#facc15"/>
    <circle cx="165" cy="220" r="6" fill="#facc15"/>
    <circle cx="175" cy="190" r="6" fill="#facc15"/>
    <circle cx="185" cy="165" r="6" fill="#facc15"/>

    <!-- Tangkai Kanan Kapas -->
    <path d="M 330,290 C 350,250 340,180 315,150" stroke-linecap="round"/>
    <circle cx="340" cy="250" r="7" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="335" cy="220" r="7" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="325" cy="190" r="7" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="315" cy="165" r="7" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- Pita Slogan -->
  <path d="M 100,400 Q 250,370 400,400 L 415,435 Q 250,405 85,435 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  <text x="250" y="424" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="3">PARPOL</text>
</svg>
